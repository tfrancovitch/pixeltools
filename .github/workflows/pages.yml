# Publishes the Pixel Snap page (the site/ folder) as a free web page with GitHub Pages.
# One-time setup by the repository owner: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# After that, every change to site/ on main is published by this workflow, or run it by hand from the Actions tab.
name: Publish the Pixel Snap page

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
